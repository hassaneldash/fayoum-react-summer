<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      const repo = '/fayoum-react-summer';
      const path = window.location.pathname.slice(repo.length) || '/';
      const search = window.location.search;
      const hash = window.location.hash;
      const redirectUrl = repo + '/?redirect' + encodeURIComponent(path + search + hash);
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body></body>
</html>
